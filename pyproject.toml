[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The importable code lives at the repo root under apps/, packages/, plugins/ (imported
# as apps.gateway.*, packages.shared.*, plugins.providers.*, etc.) rather than a single
# src/setu_gateway/ directory, so hatchling's default file-selection heuristic can't
# infer what to ship - without this, `uv sync` fails outright (including inside the
# gateway's own Docker build), since installing the project is part of a normal sync.
packages = ["apps", "packages", "plugins"]

[project]
name = "setu-gateway"
version = "0.1.0"
description = "Enterprise-grade OpenAI-compatible AI Gateway with intelligent routing, authentication, analytics, caching, observability, and developer tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "httpx>=0.24.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
]

[project.scripts]
setu = "packages.cli.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pyright>=1.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pyright>=1.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
]

# Note: this is intentionally NOT a uv workspace. apps/gateway, packages/shared,
# packages/plugin_sdk, packages/cli, and plugins/* are plain Python subpackages of this
# one project (imported as apps.gateway.*, packages.shared.*, etc.), not independent
# packages with their own pyproject.toml - a prior `[tool.uv.workspace]` declaration
# here globbed apps/*, packages/*, plugins/* expecting every match to have one, which
# broke `uv sync` entirely (including the gateway's own Docker build) since only
# packages/sdk-python does. That one is a genuinely separate, independently
# publishable client SDK - `cd packages/sdk-python && uv sync` there on its own.

# Formatting & Linting Configuration
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

# Type Checking Configuration
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pyright]
include = ["apps", "packages", "plugins", "tests"]
exclude = ["**/node_modules", "**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

# Testing Configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=apps --cov=packages --cov=plugins"
asyncio_mode = "auto"
testpaths = [
    "tests",
    "apps",
    "packages",
    "plugins",
]
