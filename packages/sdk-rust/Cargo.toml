[package]
name = "setu-gateway"
version = "0.1.0"
edition = "2021"
description = "Official Rust client for Setu Gateway"
license = "Apache-2.0"
repository = "https://github.com/setu-gateway/nexus-gateway"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
