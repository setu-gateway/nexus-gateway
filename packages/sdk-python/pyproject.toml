[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setu-gateway-sdk"
version = "0.1.0"
description = "Official Python SDK for Setu Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Setu Gateway" }]
keywords = ["setu", "llm", "ai-gateway", "openai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/setu-gateway/setu-gateway"
Repository = "https://github.com/setu-gateway/setu-gateway"

[tool.hatch.build.targets.wheel]
packages = ["setu_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
