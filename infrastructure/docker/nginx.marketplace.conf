server {
    listen 3002;
    server_name _;
    root /usr/share/nginx/html;

    # nginx's stock mime.types has no .json entry (serves as
    # application/octet-stream otherwise) - every file under this root is JSON, so
    # setting the default for the whole server is simpler than a per-location fix.
    default_type application/json;

    # Public read-only registry data (plugin manifests, no secrets, no auth) - open
    # CORS is deliberate here, the same posture npm/PyPI's own registries take, so
    # any client (the dashboard's future marketplace browser, the setu CLI, a
    # third-party tool) can fetch it directly without a server-side proxy.
    add_header Access-Control-Allow-Origin "*" always;

    location = /registry.json {
        try_files /registry.json =404;
    }

    location /schema/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
