{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "setu-gateway.gatewayName" . }}
  labels:
    {{- include "setu-gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "setu-gateway.gatewaySelectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.monitoring.serviceMonitor.path }}
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
