# Template only - do not apply as-is or commit real values. Copy to secret.yaml
# (already gitignored - see infrastructure/kubernetes/README.md), fill in real values,
# and apply that instead: kubectl apply -f infrastructure/kubernetes/secret.yaml
#
# This assumes externally-managed PostgreSQL and Redis (a managed service, or your own
# cluster's database operator/Helm chart) - these manifests don't stand up Postgres/
# Redis themselves, matching how docker-compose.yml's postgres/redis services are
# meant for local development, not as a production deployment pattern to replicate.
apiVersion: v1
kind: Secret
metadata:
  name: setu-gateway-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://setu:CHANGE_ME@your-postgres-host:5432/setu_db"
  REDIS_URL: "redis://your-redis-host:6379/0"
  JWT_SECRET: "generate-a-real-random-secret-at-least-32-chars-long"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
