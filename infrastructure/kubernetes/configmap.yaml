apiVersion: v1
kind: ConfigMap
metadata:
  name: setu-gateway-config
data:
  SERVICE_NAME: "gateway"
  ENVIRONMENT: "production"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  # Total concurrent DB connections this pod will hold is DB_POOL_SIZE + DB_MAX_OVERFLOW.
  # Multiply by your replica count when sizing Postgres's own max_connections - see
  # PERFORMANCE.md for why these aren't left at SQLAlchemy's smaller defaults.
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "30"
  DB_POOL_TIMEOUT_SECONDS: "30"
