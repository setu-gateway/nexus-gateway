apiVersion: apps/v1
kind: Deployment
metadata:
  name: setu-gateway
  labels:
    app: setu-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: setu-gateway
  template:
    metadata:
      labels:
        app: setu-gateway
    spec:
      containers:
        - name: gateway
          image: setu-gateway:latest # build from infrastructure/docker/Dockerfile.gateway and push to your registry
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: setu-gateway-config
            - secretRef:
                name: setu-gateway-secrets
          # /live only confirms the process is up; /ready checks DB + Redis
          # connectivity (apps/gateway/api/health.py) - using /live for both would mask
          # a pod that's running but can't reach its dependencies.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
