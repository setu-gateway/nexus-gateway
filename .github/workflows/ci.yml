name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  python-lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v2
      - run: uv sync
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  python-typecheck:
    name: Python Type Check (report-only)
    runs-on: ubuntu-latest
    # mypy runs in strict mode against a known pre-existing annotation backlog -
    # reported on every run but not yet a merge gate. Tracked for gradual burn-down.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v2
      - run: uv sync
      - run: uv run mypy .

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v2
      - run: uv sync
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: coverage.xml

  openapi-validate:
    name: OpenAPI Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v2
      - run: uv sync
      - name: Export live OpenAPI schema
        run: uv run python infrastructure/scripts/export_openapi.py openapi.json
      - name: Validate schema is well-formed OpenAPI
        run: uv run python -m openapi_spec_validator openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.json

  js-typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      # Targeted at the real TS packages by name, not `pnpm -r` - several packages
      # under apps/ and packages/ are still early scaffolding with echo-only scripts
      # and would silently no-op (falsely "pass") under a recursive run.
      - run: pnpm --filter @setu/dashboard typecheck
      - run: pnpm --filter @setu/sdk typecheck
      - run: pnpm --filter @setu/examples typecheck

  js-test:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      # The dashboard has no test suite yet (its "test" script is a placeholder);
      # the SDK is the only TS package with real tests today.
      - run: pnpm --filter @setu/sdk test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.gateway
          push: false
          tags: setu-gateway:ci
      - name: Build dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.dashboard
          push: false
          tags: setu-dashboard:ci

  docs-validate:
    name: Validate Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g mint
      - run: mint validate
